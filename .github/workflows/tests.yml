# Pokreće unit i UI testove Feudallinteligence na svaki push i pull_request
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run Unit Tests
        run: |
          xcodebuild test \
            -project Feudalism/Feudalism.xcodeproj \
            -scheme Feudalism \
            -destination 'platform=macOS' \
            -only-testing:FeudalismTests \
            -resultBundlePath TestResults/Unit \
            CODE_SIGN_IDENTITY="-"
        env:
          NSUnbufferedIO: YES

      - name: Build and run UI Tests
        run: |
          xcodebuild test \
            -project Feudalism/Feudalism.xcodeproj \
            -scheme Feudalism \
            -destination 'platform=macOS' \
            -only-testing:FeudalismUITests \
            -resultBundlePath TestResults/UI \
            CODE_SIGN_IDENTITY="-"
        env:
          NSUnbufferedIO: YES
